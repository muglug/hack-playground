<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hack Playground</title>
  <link rel="icon" type="image/svg+xml" href="./hack.svg">
  <link rel="stylesheet" href="./editor/codemirror.css">
  <link rel="stylesheet" href="./editor/lint.css">
  <link rel="stylesheet" href="./lint-theme.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <section class="panel" aria-label="Source editor">
      <textarea id="code" aria-label="Hack source code" spellcheck="false">function greet(string $name): string {
  return HH\Lib\Str\length($name);
}
</textarea>
    </section>
    <section class="panel" aria-label="Typechecker results">
      <div class="results">
        <p id="status" role="status">Loading typechecker…</p>
        <button id="retry" hidden>Retry checker</button>
        <div id="output"></div>
      </div>
    </section>
    <div class="share">
      <button id="share" type="button">Get link</button>
      <span id="share-status" role="status"></span>
    </div>
  </main>
  <script src="./editor/codemirror.js"></script>
  <script src="./editor/clike.js"></script>
  <script src="./editor/php.js"></script>
  <script src="./editor/lint.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
